<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">ПЕРЕКУП — концептуальная обложка</title>
<desc id="desc">Ночной авторынок и гараж: один автомобиль ремонтируется, второй готов к продаже. Тёмный стиль, фиолетовые и янтарные акценты, надпись ПЕРЕКУП. Это иллюстрация концепции, а не кадр из игры.</desc>
<defs>
<linearGradient id="sky" x2=".8" y2="1"><stop stop-color="#080c19"/><stop offset=".54" stop-color="#16142b"/><stop offset="1" stop-color="#5a3751"/></linearGradient>
<radialGradient id="sun"><stop stop-color="#fda55f" stop-opacity=".62"/><stop offset=".6" stop-color="#a8547d" stop-opacity=".23"/><stop offset="1" stop-color="#ac579f" stop-opacity="0"/></radialGradient>
<linearGradient id="ground" x2="0" y2="1"><stop stop-color="#293042"/><stop offset=".4" stop-color="#141923"/><stop offset="1" stop-color="#070a12"/></linearGradient>
<linearGradient id="car1" x2="0" y2="1"><stop stop-color="#c9b7db"/><stop offset=".35" stop-color="#615579"/><stop offset=".58" stop-color="#29263b"/><stop offset="1" stop-color="#111522"/></linearGradient>
<linearGradient id="car2" x2="1" y2="1"><stop stop-color="#d3a17d"/><stop offset=".4" stop-color="#733a45"/><stop offset="1" stop-color="#241b28"/></linearGradient>
<linearGradient id="purp" x2="1" y2="0"><stop stop-color="#8348ff"/><stop offset=".6" stop-color="#b28cff"/><stop offset="1" stop-color="#f1deff"/></linearGradient>
<linearGradient id="glass" x2="0" y2="1"><stop stop-color="#4e5067"/><stop offset="1" stop-color="#121828"/></linearGradient>
<linearGradient id="leftOverlay" x2="1" y2="0"><stop stop-color="#080a16"/><stop offset=".65" stop-color="#0b0c1e" stop-opacity=".96"/><stop offset="1" stop-color="#0b0c1e" stop-opacity="0"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="23"/></filter>
<filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#03030b" flood-opacity=".9"/></filter>
<pattern id="grid" width="74" height="38" patternUnits="userSpaceOnUse"><path d="M0 38 L74 38" stroke="#b6abd0" stroke-opacity=".08"/><path d="M74 0 L74 38" stroke="#b6abd0" stroke-opacity=".06"/></pattern>
</defs>
