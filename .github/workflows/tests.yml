name: Automated tests

on:
  push:
    branches:
      - codex/vertical-slice-v0-0-1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Lua, package, and UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install test runtime
        run: python -m pip install -r requirements-test.txt

      - name: Run automated checks and build ZIP
        run: python tools/run_tests.py
